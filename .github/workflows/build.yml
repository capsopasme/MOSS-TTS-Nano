name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee build.log; then
            # Surface the real errors as annotations (readable via the API, not just raw logs).
            grep -E "^e: |error:|What went wrong|Could not |> [A-Z].*(failed|Failed|error)|FAILED|Exception" build.log \
              | grep -v "^\s*at " | head -60 > errors.txt || true
            split -l 6 errors.txt err_ || true
            for f in err_*; do
              [ -f "$f" ] && echo "::error title=build::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$f")"
            done
            exit 1
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/MossTtsNano-${GITHUB_SHA::7}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MossTtsNano-apk
          path: dist/*.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --title "$GITHUB_REF_NAME" --generate-notes

  engine-mock-test:
    # Runs the real engine code on a desktop JVM against mock ONNX graphs with the exact
    # I/O contract of the MOSS export (KV hand-off, pinned outputs, codec state, cancel…).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Run mock engine test
        run: bash tools/mock/run_mock_test.sh
