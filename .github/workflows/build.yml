name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # tolerate line-wrapped base64 (e.g. `base64 release.jks` without -w0)
            echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            missing=""
            [ -n "$SIGNING_STORE_PASSWORD" ] || missing="$missing SIGNING_STORE_PASSWORD"
            [ -n "$SIGNING_KEY_ALIAS" ] || missing="$missing SIGNING_KEY_ALIAS"
            [ -n "$SIGNING_KEY_PASSWORD" ] || missing="$missing SIGNING_KEY_PASSWORD"
            if [ -n "$missing" ]; then echo "::error title=signing::missing secrets:$missing"; exit 1; fi
            # Check the store/alias/password before Gradle so a typo gives a readable error.
            if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null 2>"$RUNNER_TEMP/kt.err"; then
              echo "::error title=signing::keystore check failed: $(head -c 300 "$RUNNER_TEMP/kt.err" | tr '\n' ' ')"
              exit 1
            fi
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error title=signing::release tag without SIGNING_KEYSTORE_BASE64 secret: refusing to publish a debug-signed APK"
            exit 1
          else
            echo "::notice title=signing::no release key configured, APK is signed with the debug key"
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee build.log; then
            # Surface the real errors as annotations (readable via the API, not just raw logs).
            grep -E "^e: |error:|What went wrong|Could not |> [A-Z].*(failed|Failed|error)|FAILED|Exception" build.log \
              | grep -v "^\s*at " | head -60 > errors.txt || true
            split -l 6 errors.txt err_ || true
            for f in err_*; do
              [ -f "$f" ] && echo "::error title=build::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$f")"
            done
            exit 1
          fi
          mkdir -p dist
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          NAME="MossTtsNano-${VERSION}-${GITHUB_SHA::7}.apk"
          [[ "$GITHUB_REF" == refs/tags/v* ]] && NAME="MossTtsNano-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$NAME"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=$(ls dist/*.apk)
          "$APKSIGNER" verify --print-certs "$APK" > certs.txt
          cat certs.txt
          DN=$(grep -m1 "certificate DN" certs.txt | sed 's/.*DN: //')
          SHA=$(grep -m1 "certificate SHA-256 digest" certs.txt | sed 's/.*digest: //')
          echo "::notice title=apk signer::$DN | SHA-256 $SHA | $(du -h "$APK" | cut -f1)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && echo "$DN" | grep -q "CN=Android Debug"; then
            echo "::error title=signing::release APK is debug-signed"; exit 1
          fi
          # The APK must contain the native libs the app needs.
          unzip -l "$APK" | grep -E "lib/arm64-v8a/lib(onnxruntime|mossnano_jni)" || { echo "::error::native libs missing"; exit 1; }

      - uses: actions/upload-artifact@v5
        with:
          name: MossTtsNano-apk
          path: dist/

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE=""
          if [ -f "docs/release-notes/${GITHUB_REF_NAME}.md" ]; then NOTES_FILE="docs/release-notes/${GITHUB_REF_NAME}.md"; fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          elif [ -n "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE" --latest
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --latest
          fi

  engine-mock-test:
    # Runs the real engine code on a desktop JVM against mock ONNX graphs with the exact
    # I/O contract of the MOSS export (KV hand-off, pinned outputs, codec state, cancel…).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Run mock engine test
        run: bash tools/mock/run_mock_test.sh
