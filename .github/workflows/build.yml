name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Resolve signing key
        # Accepts the usual secret names (SIGNING_KEYSTORE_BASE64 / KEYSTORE_BASE64 / SIGNING_KEY …),
        # so the workflow works with whatever naming the secrets were created with. Only secret
        # *names* are ever printed; values stay masked.
        if: github.event_name != 'pull_request'
        env:
          S_SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          S_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          S_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          S_RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          S_KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          S_SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          S_KEY_STORE_BASE64: ${{ secrets.KEY_STORE_BASE64 }}
          S_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          S_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          S_KEYSTORE: ${{ secrets.KEYSTORE }}
          S_KEY_STORE: ${{ secrets.KEY_STORE }}
          S_KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          S_SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          S_SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          S_SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          S_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          S_KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          S_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          S_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          S_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          S_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          S_SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          S_SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          S_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_ALIAS: ${{ secrets.ALIAS }}
          S_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          S_KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          S_SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
          S_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          S_SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          S_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          S_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          S_KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          S_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          pick() {
            for k in "$@"; do
              local var="S_$k"
              if [ -n "${!var:-}" ]; then printf '%s' "${!var}"; return 0; fi
            done
            return 0
          }
          KS=$(pick SIGNING_KEYSTORE_BASE64 KEYSTORE_BASE64 ANDROID_KEYSTORE_BASE64 RELEASE_KEYSTORE_BASE64 KEYSTORE_B64 SIGNING_KEYSTORE KEY_STORE_BASE64 RELEASE_KEYSTORE ANDROID_KEYSTORE KEYSTORE KEY_STORE KEYSTORE_FILE SIGNING_KEY_BASE64 SIGNING_KEY)
          SP=$(pick SIGNING_STORE_PASSWORD KEYSTORE_PASSWORD KEY_STORE_PASSWORD STORE_PASSWORD RELEASE_STORE_PASSWORD SIGNING_KEYSTORE_PASSWORD ANDROID_KEYSTORE_PASSWORD SIGNING_PASSWORD)
          AL=$(pick SIGNING_KEY_ALIAS KEY_ALIAS ALIAS RELEASE_KEY_ALIAS KEYSTORE_ALIAS SIGNING_ALIAS ANDROID_KEY_ALIAS)
          KP=$(pick SIGNING_KEY_PASSWORD KEY_PASSWORD RELEASE_KEY_PASSWORD KEYSTORE_KEY_PASSWORD ANDROID_KEY_PASSWORD)
          # (command substitution runs in a subshell: recompute the list of names that are set)
          SET=""; for k in SIGNING_KEYSTORE_BASE64 KEYSTORE_BASE64 ANDROID_KEYSTORE_BASE64 RELEASE_KEYSTORE_BASE64 KEYSTORE_B64 SIGNING_KEYSTORE KEY_STORE_BASE64 RELEASE_KEYSTORE ANDROID_KEYSTORE KEYSTORE KEY_STORE KEYSTORE_FILE SIGNING_KEY_BASE64 SIGNING_KEY SIGNING_STORE_PASSWORD KEYSTORE_PASSWORD KEY_STORE_PASSWORD STORE_PASSWORD RELEASE_STORE_PASSWORD SIGNING_KEYSTORE_PASSWORD ANDROID_KEYSTORE_PASSWORD SIGNING_PASSWORD SIGNING_KEY_ALIAS KEY_ALIAS ALIAS RELEASE_KEY_ALIAS KEYSTORE_ALIAS SIGNING_ALIAS ANDROID_KEY_ALIAS SIGNING_KEY_PASSWORD KEY_PASSWORD RELEASE_KEY_PASSWORD KEYSTORE_KEY_PASSWORD ANDROID_KEY_PASSWORD; do v="S_$k"; if [ -n "${!v:-}" ]; then SET="$SET $k"; fi; done
          if [ -z "$KS" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error title=signing::no keystore secret found (signing-related secrets set:${SET:- none}); refusing to publish a debug-signed APK"
              exit 1
            fi
            echo "::notice title=signing::no keystore secret found (signing-related secrets set:${SET:- none}); APK is signed with the debug key"
            exit 0
          fi
          [ -n "$KP" ] || KP="$SP"   # PKCS12 stores use one password for both
          for v in "$SP" "$KP"; do if [ -n "$v" ]; then echo "::add-mask::$v"; fi; done
          # tolerate line-wrapped base64 (e.g. `base64 release.jks` without -w0)
          if ! printf '%s' "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null || [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error title=signing::keystore secret is not valid base64 (secrets set:$SET)"; exit 1
          fi
          if [ -z "$SP" ]; then echo "::error title=signing::no keystore password secret found (secrets set:$SET)"; exit 1; fi
          if [ -z "$AL" ]; then
            # single-entry keystore: use its alias
            AL=$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$SP" 2>/dev/null | sed -n 's/^Alias name: //p')
            [ "$(printf '%s\n' "$AL" | grep -c .)" = 1 ] || { echo "::error title=signing::no key alias secret and the keystore has $(printf '%s\n' "$AL" | grep -c .) entries (secrets set:$SET)"; exit 1; }
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$SP" -alias "$AL" >/dev/null 2>"$RUNNER_TEMP/kt.err"; then
            echo "::error title=signing::keystore/password/alias check failed: $(grep -v "Picked up" "$RUNNER_TEMP/kt.err" | head -c 300 | tr '\n' ' ') (secrets set:$SET)"
            exit 1
          fi
          {
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_PASSWORD=$SP"
            echo "SIGNING_KEY_ALIAS=$AL"
            echo "SIGNING_KEY_PASSWORD=$KP"
          } >> "$GITHUB_ENV"
          echo "::notice title=signing::release key found (secrets set:$SET)"

      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee build.log; then
            # Surface the real errors as annotations (readable via the API, not just raw logs).
            grep -E "^e: |error:|What went wrong|Could not |> [A-Z].*(failed|Failed|error)|FAILED|Exception" build.log \
              | grep -v "^\s*at " | head -60 > errors.txt || true
            split -l 6 errors.txt err_ || true
            for f in err_*; do
              [ -f "$f" ] && echo "::error title=build::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$f")"
            done
            exit 1
          fi
          mkdir -p dist
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          NAME="MossTtsNano-${VERSION}-${GITHUB_SHA::7}.apk"
          [[ "$GITHUB_REF" == refs/tags/v* ]] && NAME="MossTtsNano-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$NAME"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=$(ls dist/*.apk)
          "$APKSIGNER" verify --print-certs "$APK" > certs.txt
          cat certs.txt
          DN=$(grep -m1 "certificate DN" certs.txt | sed 's/.*DN: //')
          SHA=$(grep -m1 "certificate SHA-256 digest" certs.txt | sed 's/.*digest: //')
          echo "::notice title=apk signer::$DN | SHA-256 $SHA | $(du -h "$APK" | cut -f1)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && echo "$DN" | grep -q "CN=Android Debug"; then
            echo "::error title=signing::release APK is debug-signed"; exit 1
          fi
          # The APK must contain the native libs the app needs.
          unzip -l "$APK" | grep -E "lib/arm64-v8a/lib(onnxruntime|mossnano_jni)" || { echo "::error::native libs missing"; exit 1; }

      - uses: actions/upload-artifact@v5
        with:
          name: MossTtsNano-apk
          path: dist/

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE=""
          if [ -f "docs/release-notes/${GITHUB_REF_NAME}.md" ]; then NOTES_FILE="docs/release-notes/${GITHUB_REF_NAME}.md"; fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          elif [ -n "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE" --latest
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --latest
          fi

  engine-mock-test:
    # Runs the real engine code on a desktop JVM against mock ONNX graphs with the exact
    # I/O contract of the MOSS export (KV hand-off, pinned outputs, codec state, cancel…).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Run mock engine test
        run: bash tools/mock/run_mock_test.sh
